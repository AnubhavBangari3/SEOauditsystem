services:
  db:
    image: postgres:17
    container_name: seo_postgres
    restart: always
    environment:
      POSTGRES_DB: seo_audit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2722729
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: seo_redis
    restart: always
    ports:
      - "6380:6379"

  web:
    build: .
    container_name: seo_web
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: seo_celery
    command: celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: